<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unmask — reveal hidden Unicode and smuggled AI instructions</title>
    <meta
      name="description"
      content="Paste any text, skill file, or MCP tool description and instantly see the hidden Unicode, zero-width characters, homoglyphs, and smuggled AI instructions a human can't see — but a model will read."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0714'/%3E%3Cpath d='M16 34c4-12 12-18 16-18s12 6 16 18c-4 12-12 18-16 18s-12-6-16-18z' fill='none' stroke='%23a742ff' stroke-width='3'/%3E%3Ccircle cx='32' cy='34' r='6' fill='%236dffb8'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1 class="wordmark" aria-label="unmask">
          <span aria-hidden="true">
            <span class="glyph">u</span><span class="glyph">n</span><span
              class="glyph glyph--ghost"
              >m</span
            ><span class="glyph glyph--ghost">a</span><span class="glyph glyph--ghost">s</span
            ><span class="glyph">k</span>
          </span>
        </h1>
        <p class="pitch">
          Paste any text, skill file, or MCP tool description. Unmask decodes zero-width
          characters, bidi overrides, Unicode tag smuggling, and homoglyphs — the hidden
          Unicode a human can't see, but a model will read.
        </p>
      </header>

      <main class="light-table">
        <section class="pane pane--input" aria-label="What you see">
          <h2>What you see</h2>
          <div class="editor">
            <div id="overlay" class="overlay" aria-hidden="true"></div>
            <textarea
              id="input-area"
              class="input-area"
              placeholder="Paste text here to scan it for hidden Unicode…"
              aria-label="Text to scan"
              spellcheck="false"
            ></textarea>
          </div>
          <p id="file-error" class="file-error" role="alert" hidden></p>
          <div class="toolbar">
            <button id="sanitize-btn" type="button">Copy sanitized</button>
            <button id="upload-btn" type="button" class="secondary">Upload file</button>
            <input
              id="file-input"
              class="visually-hidden"
              type="file"
              accept=".md,.txt,.json,text/plain,application/json,text/markdown"
              tabindex="-1"
              aria-hidden="true"
            />
            <span id="summary" class="summary" role="status" aria-live="polite"></span>
          </div>
        </section>

        <nav id="findings-rail" class="findings-rail" aria-label="Findings"></nav>

        <section class="pane pane--decoded" aria-label="What the model sees">
          <h2>What the model sees</h2>
          <div id="decoded" class="decoded" aria-live="polite"></div>
          <div id="hidden-payload" class="hidden-payload" hidden>
            <h3>Hidden payload decoded</h3>
            <p id="hidden-payload-text" class="hidden-payload-text"></p>
            <p id="hidden-payload-heuristic" class="hidden-payload-heuristic" hidden></p>
          </div>
          <div class="toolbar">
            <button id="report-btn" type="button" class="secondary">Copy report</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
